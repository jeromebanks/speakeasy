[package]
name = "speakeasy"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Local-first peer-to-peer publishing of opaque versioned datasets"
# License not yet selected; do not publish to crates.io.
publish = false

# iroh and iroh-blobs are pinned exactly; see docs/transport-decision.md.
[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4"
hex = "0.4"
iroh = "=1.3.0"
iroh-blobs = "=0.103.0"
iroh-tickets = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
n0-future = "0.3"
tempfile = "3"
